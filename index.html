     manifest placed inside the Apps Script page is ignored and the
     app can never be installed. (Verified: a manifest in an iframe is

     icons and the service worker, then loads the real FSMS in a frame
     underneath. To the phone it is an installable app; to you it is
     the same Apps Script deployment you already run.

<style>
  :root { --navy:#1E3A8A; --dark:#0F172A; --gold:#F4B400; }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--dark);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* the Apps Script app fills the window; the notch area stays navy */
  #app {
    position:fixed; inset:0; width:100%; height:100%;
    border:0; display:block; background:#F8FAFC;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    opacity:0; transition:opacity .45s ease;
  }
  #app.ready { opacity:1; }

  /* ---------- splash ---------- */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    /* 22px between EVERY child left the mark floating far above the
       wordmark, because the mark is 140px of mostly-transparent PNG and the
       glyph sits well inside it. The logo now hugs its name and only the
       lower block is spaced. */
    gap:0; padding:32px;
    background:radial-gradient(120% 90% at 50% 30%, #16233f 0%, var(--dark) 70%);
    transition:opacity .5s ease, visibility .5s;
    overflow:hidden;          /* bubbles drift outward and must not scroll */
  }
  #splash.hide { opacity:0; visibility:hidden; }

  /* The logo zooms in, settles, then breathes gently while it waits.
     Two separate animations so the entrance can be sharp while the idle
     loop stays slow — one keyframe set doing both always looks restless. */
  /* The mark KEEPS zooming in, slowly, for as long as the app is loading.
     The old version did a 1-second entrance and then sat almost still, so
     on a fast connection you never saw it move at all — which is why the
     school said "the effect for it to zoom in is not there". This is one
     continuous push inward: it starts small and blurred and grows past its
     resting size, so at any moment you catch it mid-zoom. */
  .mark {
    position:relative; z-index:1;
    width:150px; height:150px; object-fit:contain;
    margin-bottom:-14px;      /* close the gap the transparent PNG leaves */
    filter:drop-shadow(0 10px 30px rgba(244,180,0,.30));
    animation:zoomIn 5.5s cubic-bezier(.22,.7,.3,1) infinite;
  }
  @keyframes zoomIn {
    0%   { opacity:0; transform:scale(.30); filter:blur(8px)
           drop-shadow(0 10px 30px rgba(244,180,0,0)); }
    18%  { opacity:1; filter:blur(0)
           drop-shadow(0 10px 30px rgba(244,180,0,.30)); }
    82%  { opacity:1; transform:scale(1.14); filter:blur(0)
           drop-shadow(0 14px 38px rgba(244,180,0,.34)); }
    100% { opacity:0; transform:scale(1.55); filter:blur(5px)
           drop-shadow(0 14px 38px rgba(244,180,0,0)); }
  }

  /* A soft glow that expands out from behind the mark as it lands. */
  .halo {
    position:absolute; width:150px; height:150px; border-radius:50%;
    /* Pinned to the mark's own position rather than sitting in the flex
       flow, so the glow cannot add height between the logo and the name. */
    top:50%; left:50%; margin:-135px 0 0 -75px;
    background:radial-gradient(circle, rgba(244,180,0,.20) 0%, rgba(244,180,0,0) 68%);
    animation:halo 5.5s ease-out infinite;
    pointer-events:none;
  }
  @keyframes halo {
    0%   { opacity:0; transform:scale(.35); }
    25%  { opacity:1; }
    100% { opacity:0; transform:scale(2.1); }
  }

  /* ---------- greeting bubbles ----------
     "Hello" in the languages the school teaches and hears, drifting up and
     popping. A language school's splash screen should feel like a language
     school, and it fills the wait with something to read rather than a bar
     to stare at. Positioned absolutely so they never move the logo. */
  .bubble {
    position:absolute; z-index:0;
    padding:9px 16px; border-radius:999px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(244,180,0,.22);
    color:#E2E8F0; font-size:14px; font-weight:600; white-space:nowrap;
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none;
    animation:pop var(--dur,5s) var(--delay,0s) ease-out infinite;
  }
  /* Rise, then burst: the scale kick at the end is the "pop". */
  @keyframes pop {
    0%   { opacity:0; transform:translateY(28px) scale(.55); }
    14%  { opacity:1; transform:translateY(14px) scale(1); }
    68%  { opacity:.92; transform:translateY(-42px) scale(1); }
    86%  { opacity:.55; transform:translateY(-64px) scale(1.18); }
    100% { opacity:0;  transform:translateY(-72px) scale(1.45); }
  }

  /* the splash leaves by zooming slightly INTO the app, not just fading */
  #splash.hide .mark { transform:scale(1.35); opacity:0;
                       transition:transform .5s ease-in, opacity .4s ease-in;
                       animation:none; }
  #splash.hide .halo { opacity:0; animation:none; }

  /* gap:0 on the flex column closed the logo gap but also crushed these
     together. Space them individually instead. */
  .wordmark {
    color:#fff; font-size:26px; font-weight:800; letter-spacing:.14em;
    animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .tagline {
    color:#94A3B8; font-size:13px; text-align:center; max-width:280px;
    margin-top:14px; line-height:1.6;
    animation:rise .7s .18s cubic-bezier(.2,.8,.2,1) both;
  }

  .bar {
    width:170px; height:3px; border-radius:3px; overflow:hidden;
    margin-top:26px;
    background:rgba(255,255,255,.13);
    animation:rise .7s .26s cubic-bezier(.2,.8,.2,1) both;
  }
  .bar i {
    display:block; height:100%; width:38%; border-radius:3px;
    background:linear-gradient(90deg, var(--navy), var(--gold));
    animation:slide 1.15s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform:translateX(-100%); }
    100% { transform:translateX(340%); }
  }

  /* ---------- the slow / failed case ---------- */
  #hint {
    position:fixed; left:0; right:0; bottom:26px; z-index:11;
    text-align:center; color:#94A3B8; font-size:13px; padding:0 28px;
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #hint.show { opacity:1; pointer-events:auto; }
  #hint a { color:var(--gold); font-weight:600; }

  @media (prefers-reduced-motion: reduce) {
    .mark, .wordmark, .tagline, .bar, .halo { animation:none; }
    .mark { opacity:1; transform:none; }
    .halo { display:none; }
    .bubble { display:none; }
    .bar i { animation:none; width:100%; }
    #splash.hide .mark { transition:none; }
  }
</style>
</head>

<div id="splash">
  <div class="halo"></div>
  <div id="bubbles" aria-hidden="true"></div>
  <img class="mark" src="icons/splash-mark.png" alt=""
       onerror="this.onerror=null;this.src=INLINE_MARK;">
  <div class="wordmark">FSMS</div>
  <div class="tagline">Favoured Языковой Центр<br>Favoured School Management System</div>
  <div class="bar"><i></i></div>
</div>

<div id="hint">
  Still loading&hellip; <a id="direct" href="#" target="_blank" rel="noopener">Open in the browser instead</a>
</div>

<iframe id="app"
        title="FSMS"
        allow="clipboard-write; camera; microphone"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
/* ═══════════════════════════════════════════════════════════════
   ONE thing to edit in this whole project: paste your /exec URL.
   Deploy > Manage deployments > copy the Web app URL. It must end
   in /exec — a /dev URL only ever works for the owning account.
   ═══════════════════════════════════════════════════════════════ */
var FSMS_URL = 'PASTE_YOUR_EXEC_URL_HERE';

/* ═══════════════════════════════════════════════════════════════
   GREETING BUBBLES

   "Hello" in the languages a Novosibirsk language school actually
   meets. They rise and pop while the app loads.

   Spawned in JS rather than written as fixed markup so the
   positions can be randomised — a hand-placed set looks the same
   every launch, which reads as a static picture rather than an
   animation.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  var GREETINGS = [
    'Hello', 'Привет', 'Bonjour', '你好', 'Hola', 'Olá', 'Ciao',
    'Hallo', 'مرحبا', 'नमस्ते', 'こんにちは', '안녕하세요', 'Merhaba',
    'Salut', 'Здравствуйте', 'Xin chào', 'Sawubona', 'Habari'
  ];

  var host = document.getElementById('bubbles');
  if (!host) return;
  // Respect the OS setting rather than the media query alone: the elements
  // are never created, so there is nothing to animate at all.
  try {
    if (window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch (e) {}

  // Shuffle so the same three words are not always the first seen.
  var pool = GREETINGS.slice();
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }

  // A narrow phone gets fewer, or they overlap the logo.
  var count = window.innerWidth < 420 ? 7 : 11;

  for (var k = 0; k < count && k < pool.length; k++) {
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = pool[k];

    // Keep the middle clear so nothing crosses the mark or the wordmark.
    //
    // Measured against the real layout rather than guessed: the mark is
    // 150px wide and centred, and a bubble is up to ~120px, so on a 700px
    // window a gutter ending at 28% still overlapped. Anchoring each bubble
    // to the OUTSIDE edge — left for the left gutter, right for the right —
    // means the gap from centre is fixed in pixels whatever the width.
    var side = (k % 2 === 0);
    var inset = (3 + Math.random() * 16) + '%';
    if (side) { b.style.left = inset; b.style.right = 'auto'; }
    else { b.style.right = inset; b.style.left = 'auto'; }
    // Never let one start so close to the middle that it can reach the logo.
    b.style.maxWidth = 'calc(50% - 130px)';
    b.style.overflow = 'hidden';
    b.style.textOverflow = 'ellipsis';
    b.style.top = (12 + Math.random() * 68) + '%';
    b.style.setProperty('--delay', (Math.random() * 5).toFixed(2) + 's');
    b.style.setProperty('--dur', (4.4 + Math.random() * 2.6).toFixed(2) + 's');
    b.style.fontSize = (12.5 + Math.random() * 3).toFixed(1) + 'px';
    host.appendChild(b);
  }
})();

(function () {
  var frame  = document.getElementById('app');
  var splash = document.getElementById('splash');
  var hint   = document.getElementById('hint');
  var direct = document.getElementById('direct');

  var configured = /^https:\/\/script\.google\.com\/.+\/exec/.test(FSMS_URL);

  // Not configured yet — say so plainly under the logo instead of showing a
  // dead frame. Deliberately NOT an early return: the service worker still
  // has to register, or the page would never become installable and whoever
  // is setting this up could not test the install flow.
  if (!configured) {
    var note = document.createElement('div');
    note.style.cssText = 'max-width:340px;color:#94A3B8;text-align:center;font-size:13px';
    note.innerHTML =
      'Set <code style="color:#F4B400">FSMS_URL</code> in ' +
      '<code style="color:#F4B400">pwa/index.html</code> to your Apps Script ' +
      '<b>/exec</b> address, then commit again.';
    splash.appendChild(note);
    registerWorker();
    return;
  }

  direct.href = FSMS_URL;

  // Cache-bust so a phone that slept for a week does not resurrect a stale
  // Apps Script page, and carry the launcher's language through.
  var url = FSMS_URL +
    (FSMS_URL.indexOf('?') === -1 ? '?' : '&') + 'pwa=1' +
    '&t=' + Date.now();

  var settled = false;
  function reveal() {
    if (settled) return;
    settled = true;
    frame.classList.add('ready');
    splash.classList.add('hide');
    hint.classList.remove('show');
  }

  frame.addEventListener('load', function () {
    // Two reasons for the pause: Apps Script paints its own inner frame after
    // the outer one loads, and the splash has a zoom-out to finish. Rushing
    // it shows a half-drawn sign-in card behind a disappearing logo.
    setTimeout(reveal, 650);
  });

  frame.src = url;

  // If Google is slow, offer the plain browser as an escape hatch rather
  // than leaving somebody staring at a logo.
  setTimeout(function () { if (!settled) hint.classList.add('show'); }, 6000);
  // Never strand the user on the splash screen.
  setTimeout(reveal, 20000);

  registerWorker();

  /* ---------- service worker ---------- *
     Required for installability. It deliberately does NOT cache the Apps
     Script response: FSMS is live data behind a session, and serving a
     stale register or an old attendance list would be worse than an
     honest "you are offline". It caches only this launcher shell. */
  function registerWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (document.readyState === 'complete') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    } else {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  }
})();
</script>
